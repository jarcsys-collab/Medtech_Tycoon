html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: var(--bg);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen ------------------------------------------------------------------------------ */

#status {
	position: absolute;
	inset: 0;
	z-index: 1;
	display: flex;
	flex-direction: column;
	overflow: hidden;
	background-color: var(--bg);
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif;
	opacity: 1;
	transition: opacity 0.5s ease;
	user-select: none;
	-webkit-user-select: none;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

/* The same picture, blurred and dimmed, fills the space around the artwork (no extra download). */
#status-fill {
	position: absolute;
	inset: -40px;
	background: var(--jarc) center / cover no-repeat;
	filter: blur(18px) brightness(0.4) saturate(1.1);
}

/* The artwork itself: whole picture, original proportions, never stretched or cropped. */
#status-art {
	position: relative;
	flex: 1 1 auto;
	min-height: 0;
	background: var(--jarc) center / contain no-repeat;
	margin: max(12px, env(safe-area-inset-top)) max(0px, env(safe-area-inset-right)) 0 max(0px, env(safe-area-inset-left));
}

#status-panel {
	position: relative;
	flex: 0 0 auto;
	box-sizing: border-box;
	width: min(560px, calc(100% - 32px));
	margin: 12px auto max(20px, calc(env(safe-area-inset-bottom) + 12px));
	padding: 14px 18px 16px;
	background: var(--panel);
	border: 2px solid var(--edge);
	border-radius: 14px;
	box-shadow: 0 0 22px rgba(58, 138, 140, 0.3);
	text-align: center;
}

#status-title {
	margin: 0 0 10px;
	color: var(--text);
	font-size: 17px;
	font-weight: 700;
	letter-spacing: 0.5px;
}

#status-bar {
	position: relative;
	height: 12px;
	overflow: hidden;
	background: rgba(255, 255, 255, 0.08);
	border: 1px solid rgba(126, 216, 247, 0.35);
	border-radius: 999px;
}

#status-bar-fill {
	position: absolute;
	inset: 0;
	background: linear-gradient(90deg, var(--mint), var(--sky));
	border-radius: 999px;
	transform-origin: left center;
	transform: scaleX(0);
	transition: transform 0.25s ease-out;
}

/* Size unknown, or files downloaded and the engine is starting: a moving sheen, no number. */
#status-bar.busy #status-bar-fill {
	transform: scaleX(1);
	opacity: 0.35;
}

#status-bar.busy::after {
	content: '';
	position: absolute;
	top: 0;
	bottom: 0;
	width: 35%;
	background: linear-gradient(90deg, transparent, var(--mint), transparent);
	animation: status-sheen 1.2s ease-in-out infinite;
}

@keyframes status-sheen {
	from { left: -35%; }
	to { left: 100%; }
}

#status-detail {
	min-height: 18px;
	margin: 8px 0 0;
	color: var(--muted);
	font-size: 13px;
	font-variant-numeric: tabular-nums;
}

#status-notice {
	display: none;
	color: var(--text);
	font-size: 14px;
	line-height: 1.4;
}

#status-notice strong {
	display: block;
	margin-bottom: 4px;
	color: var(--error);
	font-size: 16px;
}

#status-retry {
	margin-top: 12px;
	padding: 10px 28px;
	color: var(--bg);
	background: var(--mint);
	border: 0;
	border-radius: 10px;
	font: inherit;
	font-weight: 700;
	cursor: pointer;
}

#status.failed #status-title, #status.failed #status-bar, #status.failed #status-detail {
	display: none;
}

#status.failed #status-notice {
	display: block;
}

@media (prefers-reduced-motion: reduce) {
	#status, #status-bar-fill { transition: none; }
	#status-bar.busy::after { animation: none; left: 30%; }
}

		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="status-fill"></div>
			<div id="status-art" role="img" aria-label="JARC Group building and basketball court"></div>
			<div id="status-panel">
				<p id="status-title">Loading MedTech Tycoon...</p>
				<div id="status-bar" class="busy" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100"><div id="status-bar-fill"></div></div>
				<p id="status-detail" aria-live="polite"></p>
				<div id="status-notice" role="alert">
					<strong>MedTech Tycoon could not start</strong>
					<span id="status-notice-text"></span><br>
					<button id="status-retry" type="button">Try again</button>
				</div>
			</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-bar-fill');
	const statusDetail = document.getElementById('status-detail');
	const statusNoticeText = document.getElementById('status-notice-text');

	let initializing = true;

	document.getElementById('status-retry').addEventListener('click', () => window.location.reload());

	// Real progress from Godot's loader: bytes of the engine (.wasm) and game data (.pck) so far.
	function setProgress(current, total) {
		if (!initializing) {
			return;
		}
		if (current > 0 && total > 0 && current < total) {
			const ratio = current / total;
			statusBar.classList.remove('busy');
			statusFill.style.transform = 'scaleX(' + ratio + ')';
			statusBar.setAttribute('aria-valuenow', String(Math.floor(ratio * 100)));
			statusDetail.textContent = Math.floor(ratio * 100) + '%  ·  ' + (current / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB';
		} else if (current > 0 && current >= total) {
			// Everything is downloaded; the engine is compiling and starting the game.
			statusBar.classList.add('busy');
			statusBar.setAttribute('aria-valuenow', '100');
			statusDetail.textContent = 'Starting the game...';
		} else {
			statusBar.classList.add('busy');
			statusBar.removeAttribute('aria-valuenow');
			statusDetail.textContent = '';
		}
	}

	function hideStatus() {
		if (!initializing) {
			return;
		}
		initializing = false;
		statusOverlay.classList.add('done');
		// The game fades in from black underneath; remove the overlay once its fade has finished.
		setTimeout(() => statusOverlay.remove(), 550);
	}

	function displayFailureNotice(err) {
		console.error(err);
		let text = 'An unknown error occurred.';
		if (err instanceof Error) {
			text = err.message;
		} else if (typeof err === 'string') {
			text = err;
		}
		statusNoticeText.textContent = text.replace(/[.\s]*$/, '.') + ' Check your connection and try again.';
		statusOverlay.classList.add('failed');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'This browser is missing features the game needs: ';
			displayFailureNotice(missingMsg + missing.join(', ') + '.');
		}
	} else {
		engine.startGame({
			'onProgress': setProgress,
		}).then(hideStatus, displayFailureNotice);
	}
}());
		</script>
